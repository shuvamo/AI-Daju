<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ai Daju — Your Personal Big Brother AI</title>
<meta name="theme-color" content="#1b1840" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" aria-hidden="true">द</div>
    <div class="header-info">
      <h1 class="header-name">Ai Daju</h1>
      <p class="header-sub">tero dai, always online</p>
    </div>
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
    <button id="clearBtn" title="Clear chat" aria-label="Clear chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      <span>Clear</span>
    </button>
  </header>
  <div class="dhaka" aria-hidden="true"></div>

  <div class="suggestions">
    <button class="suggestion-chip" data-msg="I need some life advice today">Life advice</button>
    <button class="suggestion-chip" data-msg="Help me stay motivated with my goals">Motivation</button>
    <button class="suggestion-chip" data-msg="I'm feeling stressed and overwhelmed">I'm stressed</button>
    <button class="suggestion-chip" data-msg="Can you help me make a tough decision?">Big decision</button>
    <button class="suggestion-chip" data-msg="Give me some tips to be more productive">Productivity</button>
  </div>

  <main id="chatMessages" aria-live="polite">
    <div id="typingIndicator" class="msg daju">
      <div class="bubble typing"><span></span><span></span><span></span></div>
    </div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <textarea id="userInput" placeholder="Bhana bhai, k bhayo?" rows="1" maxlength="500"></textarea>
      <button id="sendBtn" disabled title="Send (Enter)" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="input-footer"><span id="charCount">0/500</span><span class="input-hint">Enter to send, Shift+Enter for a new line</span></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
